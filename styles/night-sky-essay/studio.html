<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Night sky essay studio</title>
<style>
  html, body { margin: 0; background: #05070f; color: #ddd; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #060914; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 120px; }
</style>
<script>
  // studio.html?work=<id>&cut=<file> loads works/<id>/<cut>.js and works/<id>/fonts/fonts.css.
  const Q = new URLSearchParams(location.search);
  const WORK_ID = Q.get('work') || 'liubai', CUT_ID = Q.get('cut') || 'sample';
  document.write(`<link rel="stylesheet" href="works/${WORK_ID}/fonts/fonts.css">`);
</script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><button id="play">▶</button><input id="scrub" type="range" min="0" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/util.js"></script>
<script src="src/fx.js"></script>
<script src="src/chat.js"></script>
<script src="src/wordsea.js"></script>
<script src="src/broll.js"></script>
<script>document.write(`<script src="works/${WORK_ID}/${CUT_ID}.js"><\/script>`);</script>
<script>
  const cv = document.getElementById('out'), cx = cv.getContext('2d');
  const scrub = document.getElementById('scrub'), tt = document.getElementById('tt'), play = document.getElementById('play');
  scrub.max = CUT.dur;
  const show = t => { CUT.drawFrame(cx, t); tt.textContent = `${t.toFixed(2)} / ${CUT.dur.toFixed(2)} s`; };

  // Offline renderer API (render.mjs).
  window.DURATION = CUT.dur;
  window.CUES = CUT.cues;
  window.PAD = CUT.pad || [];
  window.renderAt = (t, type = 'image/jpeg', q = .92) => { CUT.drawFrame(cx, t); return cv.toDataURL(type, q); };
  window.renderSheet = (ts, cols, w) => {
    const h = w * 9 / 16, rows = Math.ceil(ts.length / cols), sh = document.createElement('canvas');
    sh.width = cols * w; sh.height = rows * h;
    const s = sh.getContext('2d');
    ts.forEach((t, i) => {
      CUT.drawFrame(cx, t);
      s.drawImage(cv, (i % cols) * w, Math.floor(i / cols) * h, w, h);
      s.fillStyle = 'rgba(0,0,0,.6)'; s.fillRect((i % cols) * w, Math.floor(i / cols) * h, 74, 24);
      s.fillStyle = '#fff'; s.font = '16px monospace'; s.fillText(t.toFixed(2) + 's', (i % cols) * w + 6, Math.floor(i / cols) * h + 17);
    });
    return sh.toDataURL('image/jpeg', .9);
  };

  let playing = false, startT = 0, startClock = 0;
  play.onclick = () => { playing = !playing; play.textContent = playing ? '❚❚' : '▶'; startT = +scrub.value; startClock = performance.now(); if (playing) tick(); };
  const tick = () => {
    if (!playing) return;
    const t = startT + (performance.now() - startClock) / 1000;
    if (t >= CUT.dur) { playing = false; play.textContent = '▶'; return; }
    scrub.value = t; show(t); requestAnimationFrame(tick);
  };
  scrub.oninput = () => show(+scrub.value);

  // Canvas text does not trigger font loading by itself: load every face up front.
  const faces = ['400', '500', '600', '700'].map(w => `${w} 40px "Noto Serif SC"`).concat(['300', '400', '500', '600', '700'].map(w => `${w} 40px "Noto Sans SC"`));
  Promise.all(faces.map(f => document.fonts.load(f, '我们每天都在聊'))).catch(() => {}).then(() => document.fonts.ready)
    .then(() => { show(0); window.ready = true; });
</script>
</body>
</html>
