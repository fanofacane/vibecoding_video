<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sitcom flat studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;800;900&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
</style>
</head>
<body>
<!-- Open as index.html?work=<id> to preview works/<id>/work.js (default: ai-zhenhuan-ep01). -->
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="100" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/engine.js"></script>
<script src="src/logos.js"></script>
<script src="src/chat.js"></script>
<script src="src/components.js"></script>
<script src="src/runtime.js"></script>
</body>
</html>
